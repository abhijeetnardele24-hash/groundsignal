[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "groundsignal-api"
version = "0.1.0"
description = "Privacy-minimized analysis API for GroundSignal"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2,<3",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
tabpfn = ["tabpfn-client"]
test = [
  "httpx>=0.28,<1",
  "pytest>=8,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
